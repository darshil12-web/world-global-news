{% for game in games %}
{% if forloop.first and not is_ajax %}
<div class="roblox-game-card poki-menu-tile">
    <a href="/" style="text-decoration: none;">
        <div class="poki-logo">pokgame</div>
    </a>
    <div class="poki-actions">
        <i data-lucide="user"></i>
        <i data-lucide="search"></i>
    </div>
    <div style="font-size: 10px; margin-top: 12px; display: flex; gap: 6px;">
        <a href="{% url 'about' %}" style="color: #888; text-decoration: none;">About</a>
        <span style="color: #ccc;">|</span>
        <a href="{% url 'contact' %}" style="color: #888; text-decoration: none;">Contact</a>
    </div>
</div>
{% endif %}

<div class="roblox-game-card 
    {% if forloop.counter0|add:2|divisibleby:11 %}span-2x2
    {% elif forloop.counter0|add:5|divisibleby:23 %}span-3x3
    {% endif %}">
    <a href="{% url 'play_game' game.slug %}" class="card-link" title="{{ game.title }}" style="width: 100%; height: 100%; display: block;">
        <div class="card-thumbnail-wrapper">
            <img src="{{ game.thumbnail_url }}" alt="{{ game.title }}" class="card-thumbnail" loading="lazy">
        </div>
        <div class="card-details" style="display: none;">
            <h4 class="card-title">{{ game.title }}</h4>
            <div class="card-creator">By {{ game.creator }}</div>
        </div>
    </a>
</div>
{% endfor %}
